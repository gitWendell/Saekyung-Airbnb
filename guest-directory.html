<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana's Saekyung Stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E8;--surface:#FFFDF9;--raise:#FFFFFF;
  --gold:#B68A3A;--goldD:#8A6626;--goldL:#D8B879;--goldTint:#F1E7D2;
  --ink:#14100B;--ink2:#655C4E;--ink3:#9E9585;--hair:#EBE2D1;--char:#1C1710;
  --sh1:0 1px 2px rgba(28,20,10,.04),0 2px 8px rgba(28,20,10,.05);
  --sh2:0 8px 24px -12px rgba(28,20,10,.18);
  --sh3:0 20px 50px -24px rgba(28,20,10,.35);
  --e:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;letter-spacing:-.011em;overflow-x:hidden}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em}
button{font-family:inherit}

/* ---- app scaffold: content anchored, comfortable top ---- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.col{width:100%;max-width:600px;padding:0 22px}
.screen{padding-top:clamp(40px,9vh,90px);padding-bottom:80px}

/* ---------- INTRO (fast, clean) ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#intro.out{animation:introOut .55s var(--e) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
#intro .mk{width:72px;height:72px;border-radius:20px;background:var(--char);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh3);opacity:0;transform:scale(.82);animation:markIn .5s var(--e) .05s forwards}
@keyframes markIn{to{opacity:1;transform:scale(1)}}
#intro .mk svg{width:38px;height:38px;fill:none;stroke:var(--goldL);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#intro .wm{text-align:center;opacity:0;transform:translateY(8px);animation:wmIn .5s var(--e) .28s forwards}
@keyframes wmIn{to{opacity:1;transform:none}}
#intro .wm .n{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
#intro .wm .s{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--goldD);font-weight:600;margin-top:7px}

/* ---- entrance: fast fade-rise, subtle, staggered ---- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.r{opacity:0;animation:rise .34s var(--e) forwards}

/* ---- screen zoom transitions ---- */
@keyframes zoomIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes zoomInUp{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes zoomOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.92)}}
@keyframes zoomBack{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.06)}}
.col.zin{animation:zoomIn .42s var(--e) both}      /* entering a unit (zoom into it) */
.col.zback{animation:zoomInUp .42s var(--e) both}  /* returning to rooms (zoom back out to overview) */
.col.zout{animation:zoomOut .3s var(--e) both}     /* leaving toward a unit */
.col.zoutBack{animation:zoomBack .3s var(--e) both}/* leaving back to rooms */

/* ---------- brand row (replaces header, lives in-flow) ---------- */
.brandrow{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:30px}
.brandrow .m{width:38px;height:38px;border-radius:11px;background:var(--char);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1)}
.brandrow .m svg{width:20px;height:20px;fill:none;stroke:var(--goldL);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brandrow .t b{font-size:14px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1}
.brandrow .t s{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink3);text-decoration:none;display:block;margin-top:4px}

/* ---------- picker ---------- */
.lead{text-align:center;margin-bottom:34px}
.lead h1{font-size:clamp(28px,6.4vw,36px);font-weight:600;line-height:1.04}
.lead p{color:var(--ink2);font-size:14.5px;margin:11px auto 0;max-width:330px}

.rooms{display:flex;flex-direction:column;gap:14px}
.room{position:relative;display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--hair);
  border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--sh1);
  transition:transform .28s var(--e),box-shadow .28s var(--e),border-color .28s var(--e)}
.room:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--goldL)}
.room:active{transform:translateY(-1px) scale(.995)}
.room .pic{width:132px;flex-shrink:0;position:relative;overflow:hidden}
.room .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--e)}
.room:hover .pic img{transform:scale(1.05)}
.room .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 60%)}
.room .body{flex:1;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:118px}
.room .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldD);font-weight:600;margin-bottom:7px}
.room .tag .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.room h3{font-size:19px;font-weight:600;line-height:1}
.room .u{font-size:13px;color:var(--ink3);margin-top:5px}
.room .arw{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  background:var(--goldTint);display:flex;align-items:center;justify-content:center;transition:transform .28s var(--e),background .28s}
.room:hover .arw{background:var(--gold);transform:translateY(-50%) translateX(3px)}
.room:hover .arw svg{stroke:#fff}
.room .arw svg{width:15px;height:15px;fill:none;stroke:var(--goldD);stroke-width:2.2;transition:stroke .28s}

/* ---------- menu ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);transition:transform .2s var(--e),background .2s}
.back:hover{background:var(--goldTint)}.back:active{transform:scale(.94)}
.back svg{width:18px;height:18px;fill:none;stroke:var(--goldD);stroke-width:2.2}
.top .ti b{font-size:15px;font-weight:600;display:block;line-height:1}
.top .ti s{font-size:11px;color:var(--ink3);text-decoration:none;display:block;margin-top:4px;letter-spacing:.02em}

.hero{position:relative;border-radius:22px;overflow:hidden;height:210px;display:flex;align-items:flex-end;padding:22px;color:#fff;margin-bottom:22px;box-shadow:var(--sh2)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.35) 62%,rgba(0,0,0,.78))}
.hero .in{position:relative;z-index:2}
.hero .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldL);font-weight:600}
.hero h2{font-size:27px;font-weight:600;margin-top:5px;line-height:1}
.hero .u{font-size:13px;color:rgba(255,255,255,.82);margin-top:6px}
.hero .chips{display:flex;gap:7px;margin-top:15px}
.hero .chips span{font-size:11px;font-weight:500;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);padding:5px 11px;border-radius:8px}

.seclbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px;cursor:pointer;
  text-align:left;box-shadow:var(--sh1);transition:transform .26s var(--e),box-shadow .26s var(--e),border-color .26s var(--e)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--goldL)}
.card:active{transform:translateY(-1px) scale(.99)}
.card .ic{width:38px;height:38px;border-radius:11px;background:var(--goldTint);display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.card .ic svg{width:19px;height:19px;fill:none;stroke:var(--goldD);stroke-width:1.9}
.card b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block}
.card p{font-size:12px;color:var(--ink3);margin-top:2px}
.card .go{position:absolute;top:16px;right:16px;opacity:0;transform:translateX(-4px);transition:opacity .26s,transform .26s var(--e)}
.card:hover .go{opacity:1;transform:none}
.card .go svg{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2.2}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(20,16,11,.44);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;animation:scrimIn .28s var(--e) forwards}
@keyframes scrimIn{to{opacity:1}}
.scrim.closing{animation:scrimOut .26s var(--e) forwards}@keyframes scrimOut{to{opacity:0}}
.sheet{background:var(--raise);width:100%;max-width:600px;border-radius:28px 28px 0 0;padding:12px 22px 32px;max-height:90vh;overflow-y:auto;
  box-shadow:0 -24px 60px -20px rgba(20,16,11,.4);
  transform-origin:var(--ox,50%) var(--oy,120%);
  transform:scale(.6);opacity:0;animation:sheetIn .4s var(--e) forwards}
@keyframes sheetIn{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.scrim.closing .sheet{animation:sheetOut .28s var(--e) forwards}
@keyframes sheetOut{to{transform:scale(.6);opacity:0}}
.grip{width:38px;height:5px;border-radius:99px;background:var(--hair);margin:4px auto 16px}
.shh{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.shh .ic{width:44px;height:44px;border-radius:13px;background:var(--goldTint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shh .ic svg{width:22px;height:22px;fill:none;stroke:var(--goldD);stroke-width:1.9}
.shh h3{font-size:20px;font-weight:600;line-height:1}
.shh s{font-size:12px;color:var(--ink3);text-decoration:none;display:block;margin-top:4px}
.shh .x{margin-left:auto;width:36px;height:36px;border-radius:11px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.shh .x:hover{background:var(--goldTint)}
.shh .x svg{width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:2.2}
.body-el{display:flex;flex-direction:column;gap:10px}
.body-el>*{opacity:0;animation:rise .32s var(--e) forwards}
.row{background:var(--bg);border:1px solid var(--hair);border-radius:13px;padding:14px 16px}
.row .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.row .v{font-size:16px;font-weight:600;margin-top:3px;word-break:break-word}
.row.mono .v{font-family:ui-monospace,Menlo,monospace;letter-spacing:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.copy{flex-shrink:0;display:flex;align-items:center;gap:6px;border:none;cursor:pointer;background:var(--raise);color:var(--goldD);
  font-weight:600;font-size:12.5px;padding:9px 13px;border-radius:9px;border:1px solid var(--hair);transition:all .18s}
.copy:hover{border-color:var(--goldL)}.copy.done{background:var(--gold);color:#fff;border-color:var(--gold)}
.copy svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.tx{font-size:14px;color:var(--ink2);line-height:1.62;padding:2px}
.tx b{color:var(--ink);font-weight:600}
.li{display:flex;gap:11px;align-items:flex-start;background:var(--bg);border:1px solid var(--hair);border-radius:11px;padding:11px 14px;font-size:14px}
.li .d{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}
.two{display:flex;gap:10px}
.two .b{flex:1;background:var(--bg);border:1px solid var(--hair);border-radius:13px;padding:15px;text-align:center}
.two .b .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.two .b .big{font-size:23px;font-weight:600;margin-top:4px}
.two .b .w{font-size:11.5px;color:var(--ink3)}
.pr{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--hair);border-radius:11px;padding:12px 15px;font-size:14px}
.pr .amt{font-weight:600;color:var(--goldD)}
.shimg{width:100%;height:160px;object-fit:cover;border-radius:13px}
.msg{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#fff;font-weight:600;font-size:14.5px;
  padding:14px;border-radius:13px;text-decoration:none;box-shadow:var(--sh2)}
.msg svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2}
.note{font-size:12px;color:var(--ink3);text-align:center}
.edit{color:var(--gold);font-style:italic}

/* ---------- passcode lock screen ---------- */
.pcinput{width:100%;padding:18px;border:1px solid var(--hair);border-radius:16px;font-size:22px;font-weight:600;
  text-align:center;letter-spacing:.16em;font-family:ui-monospace,Menlo,monospace;
  background:var(--surface);color:var(--ink)}
.pcinput:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldTint)}
.pcbtn{width:100%;margin-top:14px;padding:16px;background:var(--gold);color:#fff;border:none;border-radius:14px;
  font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:var(--sh2)}
.pcbtn:disabled{opacity:.6;cursor:wait}
.pcerr{color:#a8402f;background:#fbeeee;border-radius:11px;padding:12px 15px;font-size:13px;text-align:center}
.pcload{text-align:center;color:var(--ink3);font-size:14px;padding:40px 0}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>
</head>

</div>

<div class="app"><div class="col screen" id="col"></div></div>
<div id="sheetroot"></div>

async function rpc(fn,args){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json',
             'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
    body:JSON.stringify(args||{})});
  return res.json();
}
const redeem=passcode=>rpc('redeem_passcode',{p_passcode:passcode});

/* Same account admin.html signs into — whatever passcode unlocks the admin dashboard also
   unlocks "browse any unit" here. Nothing admin-specific is hardcoded: this just asks
   Supabase Auth whether the typed value is that account's current password. */
const ADMIN_EMAIL="info@maidsruscleaning.com.au";
async function isAdminPasscode(passcode){
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify({email:ADMIN_EMAIL,password:passcode})
    });
    return r.ok;
  }catch(e){return false;}
}

const SESSION_KEY='sk_guest_session';
const loadSession=()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;}};

const clearSession=()=>localStorage.removeItem(SESSION_KEY);

async function tryUnlock(){
  const inp=$('pcin'),btn=document.querySelector('.pcbtn');
  const val=(inp&&inp.value||'').trim();
  if(!val)return;
  btn.disabled=true;btn.textContent='Checking\u2026';
  try{
    const r=await redeem(val);
    if(r&&r.ok){
      const sess={...r,passcode:val.toUpperCase()};
      saveSession(sess);
      enterWithSession(sess);
      return;
    }
    if(await isAdminPasscode(val)){
      enterAdminMode();
      return;
    }
    renderLock('That passcode wasn\u2019t recognized. Double-check it or message Diana.');
  }catch(e){
    renderLock('Couldn\u2019t reach the server. Check your connection and try again.');
  }
}

async function boot(){
  const qs=new URLSearchParams(location.search);
  const urlCode=qs.get('code');
  renderLoading();
  if(urlCode){
    try{
      const r=await redeem(urlCode);
      if(r&&r.ok){
        history.replaceState(null,'',location.pathname);
        const sess={...r,passcode:urlCode.toUpperCase()};
        saveSession(sess);
        enterWithSession(sess);
        return;
      }
    }catch(e){}
    clearSession();
    renderLock('That passcode link has expired or is no longer valid.');
    return;
  }
  const sess=loadSession();
  if(sess&&sess.passcode){
    try{
      const r=await redeem(sess.passcode);
      if(r&&r.ok){
        const fresh={...r,passcode:sess.passcode};
        saveSession(fresh);
        enterWithSession(fresh);
        return;
      }
    }catch(e){}
    clearSession();
  }
  renderLock();
}

  c.innerHTML=`
    <div class="top r" style="animation-delay:.02s">
      <button class="back" onclick="backFromMenu()">${S('<path d="M15 18l-6-6 6-6"/>')}</button>
      <div class="ti"><b>${u.name}</b><s>${u.tag} \u00B7 ${u.unit}</s></div>
    </div>
    <div class="hero r" style="animation-delay:.06s"><img src="${u.image}" alt="${u.name}">
      <div class="in"><div class="tag">${u.tag} \u00B7 ${u.floor}</div><h2 class="serif">${u.name}</h2>
        <div class="u">${state.booking&&state.booking.check_in?`${fmtDate(state.booking.check_in)} \u2192 ${fmtDate(state.booking.check_out)}`:u.unit}</div>
        <div class="chips"><span>Self check-in</span><span>Queen bed</span><span>Fast WiFi</span></div></div></div>
    <div class="seclbl r" style="animation-delay:.1s">Your stay guide</div>
    <div class="grid">${PANELS.map((p,i)=>`
      <button class="card r" style="animation-delay:${.12+i*.035}s" onclick="openPanel('${p.key}',event)">
        <span class="go">${S('<path d="M5 12h14M13 6l6 6-6 6"/>')}</span>
        <div class="ic">${S(p.icon)}</div><b>${p.label}</b><p>${p.sub}</p></button>`).join('')}</div>`;
}
function swap(renderFn,outCls,inCls){
  const c=$('col');
  c.classList.remove('zin','zback','zout','zoutBack');
  void c.offsetWidth;
  c.classList.add(outCls);
  setTimeout(()=>{
    c.classList.remove(outCls);
    renderFn();
    scrollTo(0,0);
    const nc=$('col');
    nc.classList.add(inCls);
    nc.addEventListener('animationend',()=>nc.classList.remove(inCls),{once:true});
  },230);
}

function copyRow(k,v,mono){return `<div class="row ${mono?'mono':''} crow">
  <div><div class="k">${k}</div><div class="v">${v}</div></div>
  <button class="copy" onclick="doCopy(this,'${v.replace(/'/g,"\\'")}')">${S('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>')}Copy</button></div>`}
function doCopy(b,v){navigator.clipboard&&navigator.clipboard.writeText(v);b.classList.add('done');
  b.innerHTML=S('<path d="M20 6L9 17l-5-5"/>')+'Copied';
  setTimeout(()=>{b.classList.remove('done');b.innerHTML=S('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>')+'Copy'},1300)}

function body(key,u){
  const list=a=>a.map(x=>`<div class="li"><span class="d"></span><span>${x}</span></div>`).join('');
  if(key==='wifi')return copyRow('Network',u.wifi.network,1)+copyRow('Password',u.wifi.password,1)+`<p class="tx">Converge fibre \u2014 great for streaming and calls. If it drops, unplug the router for 10 seconds.</p>`;
  if(key==='key')return `<div class="row"><div class="k">How to get in</div><div class="v" style="font-size:14px;font-weight:450;line-height:1.6;margin-top:6px">${u.key}</div></div><p class="tx">Arriving late? Message Diana ahead so she can prep your self check-in.</p>`;
  if(key==='checkin')return `<div class="two"><div class="b"><div class="k">Check-in</div><div class="big">${SHARED.checkin.in}</div><div class="w">from</div></div><div class="b"><div class="k">Check-out</div><div class="big">${SHARED.checkin.out}</div><div class="w">by</div></div></div><p class="tx">Self check-in \u2014 arrive on your own schedule. Dates lock once payment is verified.</p>`;
  if(key==='pool')return `<img class="shimg" src="${POOLNIGHT}" alt="Pool"><div class="row"><div class="k">Pool passes</div><div class="v" style="font-size:14px;font-weight:450;line-height:1.55;margin-top:6px">${SHARED.pool.cards}</div></div>${copyRow('Pool hours',SHARED.pool.hours)}<p class="tx">Bring a towel from the unit; shower before entering. Children must be supervised.</p>`;
  if(key==='inunit')return list(SHARED.inunit);
  if(key==='kitchen')return list(["Cooking permitted \u2014 basic appliances & utensils","Induction cooker","Refrigerator for food storage","Washer & dryer for laundry","Dining table & dinnerware"])+`<p class="tx">Please clean up and wash what you use before check-out.</p>`;
  if(key==='drinks')return SHARED.drinks.map(d=>`<div class="pr"><span>${d.item}</span><span class="amt">${d.price}</span></div>`).join('')+`<p class="tx">Drinks are for sale in the fridge \u2014 settle your tab with Diana on check-out.</p>`;
  if(key==='rules')return list(SHARED.rules);
  if(key==='safety')return list(SHARED.safety)+`<p class="tx">The property is monitored around the clock \u2014 you're in good hands.</p>`;
  if(key==='building')return list(SHARED.building)+`<p class="tx">Shared amenities \u2014 hours may vary. Ask the guard for details.</p>`;
  if(key==='parking')return `<div class="row"><div class="k">Parking</div><div class="v" style="font-size:14px;font-weight:450;margin-top:6px">${SHARED.parkingNote}</div></div><p class="tx">${u.parking}</p>`;
  if(key==='nearby')return SHARED.nearby.map(n=>`<div class="row"><div class="v" style="font-size:15px">${n.name}</div><div class="tx" style="padding:0;margin-top:2px">${n.note}</div></div>`).join('');
  if(key==='host')return copyRow('Phone',SHARED.host.phone)+copyRow('Email',SHARED.host.email)+`<a class="msg" href="${SHARED.host.messenger}">${S('<path d="M4 4h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 011-2z"/>')}Message ${SHARED.host.name}</a><p class="note">Extra guests: \u20B1200 per person \u00B7 message to arrange</p>`;
  return '';
}
function openPanel(key,ev){
  const u=UNITS[state.unit],p=PANELS.find(x=>x.key===key);
  // origin = center of the tapped tile, as % of viewport
  let ox=50,oy=60;
  const tile=ev&&ev.currentTarget?ev.currentTarget:null;
  if(tile){const r=tile.getBoundingClientRect();
    ox=Math.round(((r.left+r.width/2)/innerWidth)*100);
    oy=Math.round(((r.top+r.height/2)/innerHeight)*100);}
  document.body.style.overflow='hidden';
  $('sheetroot').innerHTML=`<div class="scrim" id="scrim" onclick="closePanel(event)">
    <div class="sheet" style="--ox:${ox}%;--oy:${oy}%" onclick="event.stopPropagation()"><div class="grip"></div>
      <div class="shh"><div class="ic">${S(p.icon)}</div><div><h3 class="serif">${p.label}</h3><s>${u.name} \u00B7 ${u.tag}</s></div>
        <button class="x" onclick="closePanel()">${S('<path d="M18 6L6 18M6 6l12 12"/>')}</button></div>
      <div class="body-el">${body(key,u)}</div></div></div>`;
  stagger('.body-el>*',0.06,0.045);
}
function closePanel(e){if(e&&e.target.closest&&e.target.closest('.sheet'))return;
  const s=$('scrim');if(!s)return;s.classList.add('closing');
  setTimeout(()=>{document.body.style.overflow='';$('sheetroot').innerHTML=''},260)}

/* ============================================================
   DRINK PRICES FROM SUPABASE
   ------------------------------------------------------------
   Managed from the Drinks tab in admin.html. SHARED.drinks above
   is only the fallback shown until this fetch resolves.
   ============================================================ */

function formatPeso(n){
  n=Number(n);
  if(!isFinite(n))return '₱'+n;
  const s=Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  return '₱'+s;
}
async function loadDrinks(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/drinks?select=item,price,available&available=eq.true&order=id.asc`,{
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}});
    if(!res.ok)return;
    const rows=await res.json();
    if(Array.isArray(rows)&&rows.length){
      SHARED.drinks=rows.map(d=>({item:d.item,price:formatPeso(d.price)}));
      if(document.querySelector('#scrim'))openPanel('drinks');
    }
  }catch(e){ /* keep hardcoded fallback */ }
}
loadDrinks();


boot();
setTimeout(()=>{
  $('intro').classList.add('out');
  const c=$('col');c.classList.add('zin');
  c.addEventListener('animationend',()=>c.classList.remove('zin'),{once:true});
},1250);
setTimeout(()=>$('intro').style.display='none',1850);
</script>
